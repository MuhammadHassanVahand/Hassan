    /* Loading Screen Styles - Match Your Flutter App Theme */
    body {
      margin: 0;
      padding: 0;
      background: #000000;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #000000 0%, #0a0a0a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    .loading-content {
      text-align: center;
      color: white;
    }

    .logo-container {
      margin-bottom: 30px;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00FF88 0%, #00CC6A 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 20px;
      box-shadow: 0 8px 32px rgba(0, 255, 136, 0.3);
      border: 3px solid rgba(255, 255, 255, 0.1);
      padding: 8px;
    }

    .logo-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #000000;
    }

    .logo-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .logo-text {
      font-size: 24px;
      font-weight: bold;
      color: #00FF88;
      margin-bottom: 10px;
    }

    .loading-text {
      font-size: 18px;
      color: #FFFFFF;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #00FF88;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .progress-container {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin: 20px auto;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #00FF88, #00CC6A);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease;
    }

    #flutter-app {
      opacity: 0;
      transition: opacity 0.5s ease-in;
    }

    .loaded #flutter-app {
      opacity: 1;
    }

    .loaded #loading-screen {
      opacity: 0;
      pointer-events: none;
    }

    .fallback-letter {
      color: #00FF88;
      font-weight: bold;
      font-size: 36px;
      font-family: 'Arial', sans-serif;
    }

    @media (max-width: 768px) {
      .logo {
        width: 100px;
        height: 100px;
      }
      
      .fallback-letter {
        font-size: 30px;
      }
      
      .logo-text {
        font-size: 20px;
      }
      
      .loading-text {
        font-size: 16px;
      }
      
      .spinner {
        width: 40px;
        height: 40px;
      }
    }

    @media (max-width: 480px) {
      .logo {
        width: 80px;
        height: 80px;
      }
      
      .fallback-letter {
        font-size: 24px;
      }
    }
  </style>

  <!-- Flutter App -->
  <div id="flutter-app">
    <script src="flutter_bootstrap.js" async></script>
  </div>

  <script>
    // Simple fallback function
    function useFallback(img) {
      const logoInner = img.parentElement;
      logoInner.innerHTML = '<span class="fallback-letter">H</span>';
      img.style.display = 'none';
    }

    // Preload the favicon from root directory
    function preloadFavicon() {
      const img = new Image();
      img.src = 'favicon.png';
      
      img.onload = function() {
        console.log('Favicon loaded successfully from root');
      };
      
      img.onerror = function() {
        console.log('Favicon not found in root, using fallback');
        const visibleImg = document.querySelector('.logo-image');
        if (visibleImg && visibleImg.src.includes('favicon.png')) {
          useFallback(visibleImg);
        }
      };
    }

    // Loading screen management
    document.addEventListener('DOMContentLoaded', function() {
      const loadingScreen = document.getElementById('loading-screen');
      const progressBar = document.getElementById('progress-bar');
      
      // Try to preload the favicon
      preloadFavicon();
      
      let progress = 0;
      const maxProgress = 90;
      
      const progressInterval = setInterval(() => {
        progress += Math.random() * 10;
        if (progress >= maxProgress) {
          progress = maxProgress;
          clearInterval(progressInterval);
        }
        progressBar.style.width = progress + '%';
      }, 200);
      
      window.addEventListener('flutter-first-frame', function() {
        clearInterval(progressInterval);
        progressBar.style.width = '100%';
        
        setTimeout(() => {
          document.body.classList.add('loaded');
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 500);
        }, 500);
      });
      
      setTimeout(() => {
        if (document.body.classList.contains('loaded')) return;
        
        clearInterval(progressInterval);
        progressBar.style.width = '100%';
        document.body.classList.add('loaded');
        
        setTimeout(() => {
          loadingScreen.style.display = 'none';
        }, 500);
      }, 8000);
    });

    window.addEventListener('error', function() {
      const loadingText = document.querySelector('.loading-text');
      if (loadingText) {
        loadingText.textContent = 'Taking longer than expected...';
        loadingText.style.color = '#FF6B6B';
      }
    });
  </script>
